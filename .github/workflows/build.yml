name: Build Desktop App
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Generate icons (si faltan.ico/.icns)
        run: |
          if [! -f "apps/desktop/src-tauri/icons/icon.ico" ]; then
            npx --yes @tauri-apps/cli@2 icon apps/desktop/src-tauri/icons/icon.png || true
          fi
      - name: Install deps
        run: |
          if [ -f "pnpm-lock.yaml" ]; then pnpm install; elif [ -f "yarn.lock" ]; then yarn install; else npm install; fi
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        with: { projectPath:./apps/desktop, args: ${{ matrix.args }} }
