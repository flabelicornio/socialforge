name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm with corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Generate all icons
        run: |
          cd apps/desktop
          npx --yes @tauri-apps/cli@2 icon src-tauri/icons/icon.png
        shell: bash

      - name: Install deps
        run: |
          if [ -f "apps/desktop/pnpm-lock.yaml" ]; then
            cd apps/desktop && pnpm install
          elif [ -f "pnpm-lock.yaml" ]; then
            pnpm install
          else
            npm install
            if [ -f "apps/desktop/package.json" ]; then cd apps/desktop && npm install; fi
          fi
        shell: bash

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/desktop
          args: ${{ matrix.args }}
