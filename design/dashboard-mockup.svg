    <circle cx="24" cy="28" r="5" fill="#4FAE7C"/>
    <text x="38" y="32" fill="#F2F0EA" font-size="13" font-weight="600">Activo</text>
    <text x="20" y="58" fill="#9C98A3" font-size="12">Última revisión: hace 2 min</text>
    <text x="20" y="76" fill="#9C98A3" font-size="12">Próximo job: en 41 min</text>
  </g>

