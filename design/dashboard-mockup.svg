    <g transform="translate(20,20)">
      <circle cx="8" cy="8" r="8" fill="#E8590C"/>
      <text x="26" y="12" fill="#F2F0EA" font-size="12" font-weight="600">Instagram</text>
      <text x="26" y="28" fill="#9C98A3" font-size="11">@tallerdeana</text>
    </g>
    <line x1="20" y1="52" x2="236" y2="52" stroke="#38353E"/>

    <g transform="translate(20,64)">
      <circle cx="8" cy="8" r="8" fill="#4FAE7C"/>
      <text x="26" y="12" fill="#F2F0EA" font-size="12" font-weight="600">Facebook</text>
      <text x="26" y="28" fill="#9C98A3" font-size="11">Taller de Ana</text>
    </g>
    <line x1="20" y1="96" x2="236" y2="96" stroke="#38353E"/>

    <g transform="translate(20,108)">
      <circle cx="8" cy="8" r="8" fill="#9C98A3"/>
      <text x="26" y="12" fill="#F2F0EA" font-size="12" font-weight="600">LinkedIn</text>
      <text x="26" y="28" fill="#9C98A3" font-size="11">Taller de Ana MX</text>
    </g>

    <g transform="translate(20,152)">
      <rect width="216" height="32" rx="3" fill="none" stroke="#38353E" stroke-dasharray="3,3"/>
      <text x="108" y="20" fill="#9C98A3" font-size="12" text-anchor="middle">+ Conectar otra cuenta</text>
    </g>
  </g>

  <!-- ===================== COLA LOCAL — TIMELINE 14 DÍAS (franja inferior) ===================== -->
  <text x="252" y="612" fill="#F2F0EA" font-size="15" font-weight="700">Cola local · próximos 14 días</text>

  <g transform="translate(252,630)">
    <rect x="0" y="0" width="1156" height="110" rx="4" fill="#242229" stroke="#38353E"/>

    <!-- 14 columnas de día -->
