<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Space Grotesk', system-ui, sans-serif">

  <!-- ===== TOKENS (referencia rápida para editar) =====
    Fondo base:      #1C1B1F
    Panel:           #242229
    Panel alterno:   #2B2831
    Línea/borde:     #38353E
    Texto principal: #F2F0EA
    Texto secundario:#9C98A3
    Acento (ember):  #E8590C
    Acento suave:    #F2A65A
    Éxito:           #4FAE7C
    Tipografía título: Space Grotesk (geométrica, evoca "forja/industrial")
    Tipografía cuerpo: Inter
  ================================================== -->

  <rect width="1440" height="900" fill="#1C1B1F"/>

  <!-- ===================== SIDEBAR ===================== -->
  <rect x="0" y="0" width="220" height="900" fill="#242229"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#38353E" stroke-width="1"/>

  <!-- logo mark: yunque simplificado -->
  <g transform="translate(28,28)">
    <rect x="0" y="10" width="28" height="8" rx="1" fill="#E8590C"/>
    <rect x="8" y="18" width="12" height="14" fill="#E8590C"/>
    <text x="38" y="24" fill="#F2F0EA" font-size="17" font-weight="700" font-family="'Space Grotesk', sans-serif">SocialForge</text>
  </g>

  <!-- nav items -->
  <g font-size="14" fill="#9C98A3">
    <!-- item activo -->
    <rect x="12" y="88" width="196" height="40" rx="4" fill="#2B2831"/>
    <rect x="12" y="88" width="3" height="40" fill="#E8590C"/>
    <circle cx="34" cy="108" r="4" fill="#F2F0EA"/>
    <text x="50" y="112" fill="#F2F0EA" font-weight="600">Dashboard</text>

    <circle cx="34" cy="156" r="4" fill="#9C98A3"/>
    <text x="50" y="160">Calendar</text>

    <circle cx="34" cy="204" r="4" fill="#9C98A3"/>
    <text x="50" y="208">Composer</text>

    <circle cx="34" cy="252" r="4" fill="#9C98A3"/>
    <text x="50" y="256">Queue</text>

    <circle cx="34" cy="300" r="4" fill="#9C98A3"/>
    <text x="50" y="304">Media</text>

    <circle cx="34" cy="348" r="4" fill="#9C98A3"/>
    <text x="50" y="352">Accounts</text>

    <circle cx="34" cy="396" r="4" fill="#9C98A3"/>
    <text x="50" y="400">Settings</text>
  </g>

  <!-- estado local-only, abajo del sidebar -->
  <g transform="translate(12,800)">
    <rect width="196" height="64" rx="4" fill="#2B2831" stroke="#38353E"/>
    <circle cx="20" cy="22" r="4" fill="#4FAE7C"/>
    <text x="32" y="26" fill="#F2F0EA" font-size="12" font-weight="600">Local Only activo</text>
    <text x="16" y="46" fill="#9C98A3" font-size="11">Tus datos viven en esta máquina</text>
  </g>

  <!-- ===================== TOP BAR ===================== -->
  <text x="252" y="52" fill="#F2F0EA" font-size="22" font-weight="700" font-family="'Space Grotesk', sans-serif">Taller de Ana</text>
  <text x="252" y="72" fill="#9C98A3" font-size="13">Workspace · 3 cuentas conectadas</text>

  <g transform="translate(1268,30)">
    <rect width="140" height="40" rx="4" fill="#E8590C"/>
    <text x="70" y="25" fill="#1C1B1F" font-size="13" font-weight="700" text-anchor="middle">Nueva publicación</text>
  </g>

  <line x1="252" y1="92" x2="1408" y2="92" stroke="#38353E" stroke-width="1"/>

  <!-- ===================== PRÓXIMAS PUBLICACIONES (columna izquierda) ===================== -->
  <text x="252" y="130" fill="#F2F0EA" font-size="15" font-weight="700">Próximas publicaciones</text>

  <g transform="translate(252,148)">
    <rect width="620" height="420" rx="4" fill="#242229" stroke="#38353E"/>

    <!-- fila 1 -->
    <g transform="translate(20,20)">
      <circle cx="6" cy="6" r="6" fill="#E8590C"/>
      <text x="24" y="10" fill="#F2F0EA" font-size="13" font-weight="600">Lanzamiento colección otoño</text>
      <text x="24" y="30" fill="#9C98A3" font-size="12">Instagram · Lunes 10:00</text>
      <rect x="500" y="-6" width="80" height="24" rx="3" fill="#2B2831" stroke="#4FAE7C"/>
      <text x="540" y="10" fill="#4FAE7C" font-size="11" text-anchor="middle" font-weight="600">READY</text>
    </g>
    <line x1="20" y1="62" x2="600" y2="62" stroke="#38353E"/>

    <!-- fila 2 -->
    <g transform="translate(20,82)">
      <circle cx="6" cy="6" r="6" fill="#F2A65A"/>
      <text x="24" y="10" fill="#F2F0EA" font-size="13" font-weight="600">Promoción de octubre — cortes</text>
      <text x="24" y="30" fill="#9C98A3" font-size="12">Facebook · Lunes 14:00</text>
      <rect x="500" y="-6" width="80" height="24" rx="3" fill="#2B2831" stroke="#9C98A3"/>
      <text x="540" y="10" fill="#9C98A3" font-size="11" text-anchor="middle" font-weight="600">PENDING</text>
    </g>
    <line x1="20" y1="124" x2="600" y2="124" stroke="#38353E"/>

    <!-- fila 3 -->
    <g transform="translate(20,144)">
      <circle cx="6" cy="6" r="6" fill="#4FAE7C"/>
      <text x="24" y="10" fill="#F2F0EA" font-size="13" font-weight="600">Detrás de cámaras — taller</text>
      <text x="24" y="30" fill="#9C98A3" font-size="12">LinkedIn · Martes 09:00</text>
      <rect x="500" y="-6" width="90" height="24" rx="3" fill="#2B2831" stroke="#4FAE7C"/>
      <text x="545" y="10" fill="#4FAE7C" font-size="11" text-anchor="middle" font-weight="600">PUBLISHED</text>
    </g>
    <line x1="20" y1="186" x2="600" y2="186" stroke="#38353E"/>

    <!-- fila 4: fallo -->
    <g transform="translate(20,206)">
      <circle cx="6" cy="6" r="6" fill="#E05353"/>
      <text x="24" y="10" fill="#F2F0EA" font-size="13" font-weight="600">Nuevo horario de atención</text>
      <text x="24" y="30" fill="#9C98A3" font-size="12">TikTok · Miércoles 18:00</text>
      <rect x="500" y="-6" width="80" height="24" rx="3" fill="#2B2831" stroke="#E05353"/>
      <text x="540" y="10" fill="#E05353" font-size="11" text-anchor="middle" font-weight="600">FAILED</text>
    </g>

    <text x="20" y="380" fill="#9C98A3" font-size="12">+ 6 publicaciones más en los próximos 14 días</text>
  </g>

  <!-- ===================== COLUMNA DERECHA ===================== -->
  <text x="900" y="130" fill="#F2F0EA" font-size="15" font-weight="700">Estado del scheduler</text>
  <g transform="translate(900,148)">
