      <!-- generamos 14 divisiones manualmente para mantenerlo editable -->
      <line x1="82" y1="10" x2="82" y2="100" stroke="#38353E"/>
      <line x1="164" y1="10" x2="164" y2="100" stroke="#38353E"/>
      <line x1="246" y1="10" x2="246" y2="100" stroke="#38353E"/>
      <line x1="328" y1="10" x2="328" y2="100" stroke="#38353E"/>
      <line x1="410" y1="10" x2="410" y2="100" stroke="#38353E"/>
      <line x1="492" y1="10" x2="492" y2="100" stroke="#38353E"/>
      <line x1="574" y1="10" x2="574" y2="100" stroke="#38353E"/>
      <line x1="656" y1="10" x2="656" y2="100" stroke="#38353E"/>
      <line x1="738" y1="10" x2="738" y2="100" stroke="#38353E"/>
      <line x1="820" y1="10" x2="820" y2="100" stroke="#38353E"/>
      <line x1="902" y1="10" x2="902" y2="100" stroke="#38353E"/>
      <line x1="984" y1="10" x2="984" y2="100" stroke="#38353E"/>
      <line x1="1066" y1="10" x2="1066" y2="100" stroke="#38353E"/>

      <text x="20" y="20">Lun</text>
      <text x="102" y="20">Mar</text>
      <text x="184" y="20">Mié</text>
      <text x="266" y="20">Jue</text>
      <text x="348" y="20">Vie</text>
      <text x="430" y="20">Sáb</text>
      <text x="512" y="20">Dom</text>
      <text x="594" y="20">Lun</text>
      <text x="676" y="20">Mar</text>
      <text x="758" y="20">Mié</text>
      <text x="840" y="20">Jue</text>
      <text x="922" y="20">Vie</text>
      <text x="1004" y="20">Sáb</text>
      <text x="1086" y="20">Dom</text>
    </g>

    <!-- puntos = publicaciones programadas en cada día -->
    <circle cx="30" cy="55" r="5" fill="#E8590C"/>
    <circle cx="46" cy="55" r="5" fill="#F2A65A"/>
    <circle cx="192" cy="55" r="5" fill="#4FAE7C"/>
    <circle cx="356" cy="55" r="5" fill="#E05353"/>
    <circle cx="438" cy="55" r="5" fill="#E8590C"/>
    <circle cx="602" cy="55" r="5" fill="#E8590C"/>
    <circle cx="684" cy="55" r="5" fill="#4FAE7C"/>
    <circle cx="848" cy="55" r="5" fill="#F2A65A"/>
    <circle cx="1012" cy="55" r="5" fill="#E8590C"/>
    <circle cx="1094" cy="55" r="5" fill="#4FAE7C"/>

    <text x="20" y="90" fill="#9C98A3" font-size="11">● programado &#160;&#160; ● publicado &#160;&#160; ● fallido</text>
  </g>

</svg>
