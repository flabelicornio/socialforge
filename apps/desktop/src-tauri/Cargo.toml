[package]
name = "socialforge-desktop"
version = "0.1.0"
description = "SocialForge Desktop Application"
authors = ["Latam Studios"]
edition = "2021"

[lib]
name = "socialforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"